[pytest]
testpaths = selenium_tests playwright_tests
# "." makes selenium_tests/, playwright_tests/ and common/ importable; ".." makes the app (db, config, ...) importable
pythonpath = . ..
addopts = --import-mode=importlib -ra
markers =
    smoke: fast UI checks, no LLM
    actions: RM accept / edit / reject flows on seeded drafts, no LLM
    llm: end-to-end flows through the real Ollama LLM (slow)
